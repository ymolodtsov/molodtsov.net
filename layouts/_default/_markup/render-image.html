{{ if .Title }}
  <figure>
{{ end }}
{{ $destination := .Destination }}
{{ $display := $destination }}
{{ $clean := replaceRE "^/" "" $destination }}
{{ if hasPrefix $clean "uploads/" }}
  {{ $generated := replaceRE "\\.(?i:jpe?g|png|webp)$" "-inline.webp" (printf "/generated/%s" $clean) }}
  {{ if fileExists (printf "static%s" $generated) }}
    {{ $display = $generated }}
  {{ end }}
{{ end }}
{{- /* Real dimensions let the browser reserve space before the image loads. */ -}}
{{ $size := dict }}
{{ $file := printf "static%s" (replaceRE `\?.*$` "" $display) }}
{{ if and (hasPrefix $display "/") (fileExists $file) (findRE `(?i)\.(jpe?g|png|webp|gif)$` $file) }}
  {{ with images.Config $file }}{{ $size = dict "width" .Width "height" .Height }}{{ end }}
{{ end }}
<a href="{{ .Destination | safeURL }}" 
   class="glightbox"
   data-gallery="{{ .Page.File.UniqueID }}"
   {{ with .Title }} title="{{ . }}" {{ end }}
>
  <img src ="{{ $display | safeURL }}" 
       alt="{{ .Text }}" 
       {{ with $size.width }}width="{{ . }}" height="{{ $size.height }}"{{ end }}
       loading="lazy"
       decoding="async"
       {{ with .Title }}
          title="{{ . }}"
       {{ end }} 
  />
</a>
   {{ if .Title }}
      <figcaption>{{ .Title }}</figcaption>
   {{ end }}
{{ if .Title }}
  </figure>
{{ end }}
