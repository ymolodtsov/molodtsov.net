<!DOCTYPE html>
<html lang="ru">
{{ partial "head.html" . }}
<body{{ if and .IsPage (eq .Type "post") }} class="page-post"{{ else if .IsHome }} class="page-home"{{ end }}>
  {{ partial "header.html" . }}
  <main id="wrapper">
	{{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "custom_footer.html" . }}
		{{ range .Site.Params.plugins_js }}
			<script src="{{ . }}"></script>
		{{ end }}
</body>
</html>
