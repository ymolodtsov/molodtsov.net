{{ $pag := $.Paginator }}
{{ if or $pag.HasPrev $pag.HasNext }}
<nav class="pagination" aria-label="Страницы">
  {{ if $pag.HasPrev }}<a class="pagination__prev" href="{{ $pag.Prev.URL }}">← Позднее</a>{{ end }}
  {{ if $pag.HasNext }}<a class="pagination__next" href="{{ $pag.Next.URL }}">Ранее →</a>{{ end }}
</nav>
{{ end }}
